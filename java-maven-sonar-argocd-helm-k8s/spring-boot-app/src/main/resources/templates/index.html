<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate CI/CD Pipeline by Het Patel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <link data-th-href="@{/css/main.css(id=${timestamp})}" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
        }
        .navbar {
            background-color: #4CAF50;
        }
        .navbar-brand {
            font-size: 24px;
        }
        .container {
            margin-top: 100px;
            text-align: center;
        }
        .display-4 {
            font-size: 3.5rem;
            color: #2c3e50;
        }
        .lead {
            font-size: 1.25rem;
            color: #34495e;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .footer {
            background-color: #34495e;
            color: #ecf0f1;
            padding: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand" href="#">🚀 CI/CD Pipeline by Het Patel</a>
</nav>

<div class="container">
    <div class="text-center">
        <h1 class="display-4" th:text="${title}">Welcome to My CI/CD Journey</h1>
        <p class="lead" th:text="${msg}">Let’s create something awesome together!</p>

        <a href="https://github.com/Hetpatel7131" target="_blank" class="btn btn-success mt-3">Explore More</a>
    </div>
</div>

<footer class="footer">
    <div class="container text-center">
        <span class="text-muted">© 2025 CI/CD Pipeline by Het Patel</span>
    </div>
</footer>

<script data-th-src="@{/js/main.js}"></script>
</body>
</html>
